services:
  - type: web
    name: euromillions-duplet-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_PATH
        value: /opt/render/project/src/data.db
      - key: SCRAPER_PROXY_API_KEY
        sync: false  # set this manually in the Render dashboard — see README
      - key: IMPORT_SECRET
        sync: false  # optional fallback, see README
